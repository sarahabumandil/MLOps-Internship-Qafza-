[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=src --cov=app --cov-report=term-missing"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]

[tool.ruff]
line-length = 110
target-version = "py312"
exclude = ["notebooks", "data", "mlruns"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]
ignore = ["E501"]

[tool.black]
line-length = 110
target-version = ["py312"]
exclude = "notebooks|data|mlruns"
